<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Palavra de Deus - Versículo do dia">

    <title>Palavra do Dia</title>

    <link rel="icon" href="cruz.jpeg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background-color: blanchedalmond;
            color: black;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

        h1 {
            font-size: 40px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .titulo-versiculo {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .referencia {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .conteudo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .texto {
            flex: 1;
        }

        .mensagem {
            font-size: 25px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .musica {
            font-size: 22px;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            max-width: 450px;
        }

        .imagem {
            flex: 1;
            text-align: center;
        }

        .imagem img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
        }

        /* TABLET E TELEMÓVEL */
        @media (max-width: 768px) {

            header {
                padding-top: 30px;
            }

            h1 {
                font-size: 30px;
            }

            main {
                padding: 20px;
            }

            .conteudo {
                flex-direction: column;
            }

            .mensagem {
                font-size: 20px;
            }

            .referencia {
                font-size: 24px;
            }

            .imagem img {
                max-width: 100%;
            }
        }

        /* TELEMÓVEIS PEQUENOS */
        @media (max-width: 480px) {

            h1 {
                font-size: 25px;
            }

            .titulo-versiculo {
                font-size: 21px;
            }

            .referencia {
                font-size: 22px;
            }

            .mensagem {
                font-size: 18px;
            }

            main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>PALAVRA DE DEUS</h1>
    </header>

    <main>

        <p class="titulo-versiculo">
            Versículo do dia
        </p>

        <p class="referencia">
            Jeremias 29:11
        </p>

        <section class="conteudo">

            <div class="texto">

                <p class="mensagem">
                    Porque sou eu que conheço os planos que tenho para vocês,
                    diz o Senhor, planos de fazê-los prosperar e não de causar
                    dano, planos de dar a vocês esperança e um futuro.
                </p>

                <p class="musica">
                    Música para meditar
                </p>

                <audio controls>
                    <source src="a_ele_e_a_gloria.mp3"
                            type="audio/mpeg">
                    O seu navegador não suporta áudio.
                </audio>

            </div>

            <div class="imagem">
                <img src="cruz.jpeg" alt="Cruz cristã">
            </div>

        </section>

    </main>

</body>

</html>
